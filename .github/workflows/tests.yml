name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Unit and regression tests (stdlib only)
        run: python -m unittest discover -s tests -q
      - name: CLI smoke test
        run: python xdg_audit.py --version

  archives:
    name: Source ZIP and tar.gz
    needs: [test, gui-smoke, wayland-smoke, desktop-sessions, benchmark, quarantine-cycle, native-sources, snapd-live, native-packages, btrfs-device]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible archives
        run: python scripts/build_archives.py --output-dir dist
      - name: Verify archive integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          unzip -t *.zip | tail -n 1
          tar -tzf *.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: xdg-audit-source-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release on version tag
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, gui-smoke, wayland-smoke, benchmark, quarantine-cycle, native-sources, snapd-live, native-packages, archives, publish-package-repository]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches source version
        shell: bash
        run: |
          actual=$(python -c 'import xdg_audit; print(xdg_audit.VERSION)')
          if [[ "$GITHUB_REF_NAME" != "v$actual" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application v$actual" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: xdg-audit-signed-${{ github.sha }}
          path: dist
      - name: Verify signed release assets
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gpgv --keyring ./xdg-audit-keyring.gpg SHA256SUMS.asc SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-dev* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "xdg-audit $GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}"

  publish-package-repository:
    name: Publish signed APT and RPM repositories
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [native-packages, archives, package-publication-check]
    permissions:
      contents: write
    uses: ./.github/workflows/package-repository.yml
    with:
      publish_new: true
    secrets: inherit

  publish-aur:
    name: Publish release recipe to AUR
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.AUR_PUBLISH_ENABLED == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdg-audit-package-arch-${{ github.sha }}
          path: aur-artifact
      - name: Upload only the tested AUR recipe using the dedicated account key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
        run: python3 packaging/publish_aur.py --bundle aur-artifact/xdg-audit-aur.zip

  gui-smoke:
    name: Native GUI smoke (Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install GTK4, Qt6, Tk, and Xvfb
        id: gui-deps
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends xvfb xauth x11-utils xdotool scrot python3-gi gir1.2-gtk-4.0 gir1.2-gtk-3.0 python3-pyqt6 python3-tk
      - name: GTK4 widget/model
        run: xvfb-run -a /usr/bin/python3 scripts/gui_smoke.py --backend gtk4
      - name: Qt6 widget/model
        run: xvfb-run -a /usr/bin/python3 scripts/gui_smoke.py --backend qt6
      - name: Tk widget/model
        run: xvfb-run -a /usr/bin/python3 scripts/gui_smoke.py --backend tk
      - name: GTK4 full application startup with Snap scope
        run: xvfb-run -a /usr/bin/python3 scripts/gui_app_smoke.py --backend gtk4 --scope snap
      - name: GTK4 PURGE preview remains responsive
        run: xvfb-run -a /usr/bin/python3 scripts/gui_async_purge_smoke.py
      - name: GTK4 shows disk-full error and refuses PURGE confirmation
        run: xvfb-run -a /usr/bin/python3 scripts/gui_async_purge_smoke.py --disk-full
      - name: GTK4 shows exact identity mismatch details and refuses PURGE confirmation
        run: xvfb-run -a /usr/bin/python3 scripts/gui_async_purge_smoke.py --identity-mismatch --output gui-layout/gtk4-identity-refusal.png
      - name: Qt6 full application startup with Snap scope
        run: xvfb-run -a /usr/bin/python3 scripts/gui_app_smoke.py --backend qt6 --scope snap
      - name: Tk full application startup with Snap scope
        run: xvfb-run -a /usr/bin/python3 scripts/gui_app_smoke.py --backend tk --scope snap
      - name: Desktop registration and real launcher path escaping
        run: /usr/bin/python3 scripts/desktop_entry_smoke.py
      - name: Adaptive GTK4 tabs and content-sized dialogs
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_layout_smoke.py --backend gtk4 --output-dir gui-layout
      - name: Adaptive GTK3 fallback tabs and dialogs
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_layout_smoke.py --backend gtk3 --output-dir gui-layout
      - name: GTK4 settings input frames on a dark theme
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env GTK_THEME=Adwaita:dark /usr/bin/python3 scripts/gui_layout_smoke.py --backend gtk4 --output-dir gui-layout/dark
      - name: Adaptive Qt6 tabs and content-sized dialogs
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_layout_smoke.py --backend qt6 --output-dir gui-layout
      - name: Adaptive Tk tabs and content-sized dialogs
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_layout_smoke.py --backend tk --output-dir gui-layout
      - name: GTK4 real GUI lifecycle with synthetic inventory
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_lifecycle_smoke.py --backend gtk4 --device-revalidation --output gui-lifecycle/gtk4-x11.json
      - name: GTK3 fallback real GUI lifecycle with synthetic inventory
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_lifecycle_smoke.py --backend gtk3 --device-revalidation --output gui-lifecycle/gtk3-x11.json
      - name: Qt6 real GUI lifecycle with synthetic inventory
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_lifecycle_smoke.py --backend qt6 --device-revalidation --output gui-lifecycle/qt6-x11.json
      - name: Tk real GUI lifecycle with synthetic inventory
        if: ${{ !cancelled() && steps.gui-deps.outcome == 'success' }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 scripts/gui_lifecycle_smoke.py --backend tk --device-revalidation --output gui-lifecycle/tk-x11.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-lifecycle-x11-${{ github.sha }}
          path: gui-lifecycle/*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-layout-${{ github.sha }}
          path: gui-layout/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  wayland-smoke:
    name: Native Wayland smoke (Weston)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install Weston and native GTK4/Qt6 Wayland clients
        id: wayland-deps
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends weston python3-gi gir1.2-gtk-4.0 python3-pyqt6 qt6-wayland
      - name: GTK4 full application on native Wayland
        run: /usr/bin/python3 scripts/gui_wayland_smoke.py --backend gtk4
      - name: Qt6 full application on native Wayland
        run: /usr/bin/python3 scripts/gui_wayland_smoke.py --backend qt6
      - name: GTK4 real GUI lifecycle on native Wayland
        if: ${{ !cancelled() && steps.wayland-deps.outcome == 'success' }}
        run: /usr/bin/python3 scripts/gui_wayland_smoke.py --backend gtk4 --lifecycle --device-revalidation --output-dir gui-lifecycle
      - name: Qt6 real GUI lifecycle on native Wayland
        if: ${{ !cancelled() && steps.wayland-deps.outcome == 'success' }}
        run: /usr/bin/python3 scripts/gui_wayland_smoke.py --backend qt6 --lifecycle --device-revalidation --output-dir gui-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-lifecycle-wayland-${{ github.sha }}
          path: gui-lifecycle/*.json
          if-no-files-found: ignore
          retention-days: 14

  desktop-sessions:
    name: Full ${{ matrix.desktop }} session
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, plasma, xfce]
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install the complete session and application toolkit
        env:
          DESKTOP: ${{ matrix.desktop }}
        timeout-minutes: 25
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          case "$DESKTOP" in
            gnome) packages=(gnome-session gnome-shell gnome-settings-daemon gjs xwayland python3-gi gir1.2-gtk-4.0) ;;
            plasma) packages=(plasma-workspace-wayland plasma-desktop kwin-wayland xwayland qml-module-qt-labs-platform python3-pyqt6 qt6-wayland) ;;
            xfce) packages=(xfce4-session xfwm4 xfce4-panel xfdesktop4 xfce4-settings xfconf thunar xvfb xauth xdotool python3-tk) ;;
          esac
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends dbus-x11 libglib2.0-bin libgl1-mesa-dri gsettings-desktop-schemas fonts-dejavu-core "${packages[@]}"
      - name: Run the actual session and native GUI lifecycle as a regular user
        env:
          DESKTOP: ${{ matrix.desktop }}
        run: /usr/bin/python3 scripts/gui_desktop_session_smoke.py --desktop "$DESKTOP" --output-dir desktop-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-session-${{ matrix.desktop }}-${{ github.sha }}
          path: desktop-evidence/*
          if-no-files-found: ignore
          retention-days: 14

  btrfs-device:
    name: Btrfs device revalidation (real remount)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install Btrfs fixture tools in the disposable VM
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends btrfs-progs
          sudo modprobe btrfs
      - name: Real remount, snapshot refusal, explicit REVALIDATE and separate PURGE/RESTORE
        run: |
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RUNNER_TEMP="$RUNNER_TEMP" \
            /usr/bin/python3 scripts/smoke_btrfs_device.py --uid "$(id -u)" --gid "$(id -g)" \
            --work-dir "$RUNNER_TEMP/xdg-btrfs-fixture" --output "$GITHUB_WORKSPACE/btrfs-device.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btrfs-device-${{ github.sha }}
          path: btrfs-device.json
          if-no-files-found: ignore
          retention-days: 30

  quarantine-cycle:
    name: Quarantine and restore E2E (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safe full cycle on disposable XDG data
        run: python scripts/smoke_quarantine_cycle.py --synthetic-inventory

  native-sources:
    name: Native ${{ matrix.provider }} inventory and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:base
            provider: pacman
          - image: ubuntu:24.04
            provider: dpkg
          - image: fedora:43
            provider: rpm
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install native test prerequisites
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -qq
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends python3 git passwd util-linux ca-certificates
          elif command -v dnf >/dev/null; then
            dnf -y --setopt=timeout=30 --setopt=retries=2 install python3 git shadow-utils util-linux
          else
            pacman -Syu --noconfirm --needed python git shadow util-linux
          fi
          useradd --create-home audit-test
      - uses: actions/checkout@v4
      - name: Native distribution regressions as an unprivileged user
        run: runuser -u audit-test -- env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -q
      - name: Real native inventory and complete quarantine lifecycle
        run: runuser -u audit-test -- env PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_native_sources.py --expect ${{ matrix.provider }}

  native-packages:
    name: Build, install and upgrade ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            family: deb
          - image: fedora:43
            family: rpm
          - image: archlinux:base
            family: arch
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install native package tools and GUI test runtime
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -qq
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends python3 python3-tk git passwd util-linux ca-certificates apt-utils gnupg xvfb xauth x11-utils desktop-file-utils
          elif command -v dnf >/dev/null; then
            dnf -y --setopt=timeout=30 --setopt=retries=2 install python3 python3-tkinter git shadow-utils util-linux coreutils procps-ng rpm-build rpm-sign createrepo_c gnupg2 xorg-x11-server-Xvfb xorg-x11-xauth xwininfo desktop-file-utils
          else
            pacman -Syu --noconfirm --needed python git shadow util-linux base-devel tk ttf-dejavu xorg-server-xvfb xorg-xauth xorg-xwininfo desktop-file-utils
          fi
          useradd --create-home package-test
      - uses: actions/checkout@v4
      - name: Check tag, source version and stable/candidate ordering
        run: python3 packaging/check_version.py
      - name: Build and verify native packages and authenticated repositories
        run: python3 -B packaging/smoke_native.py --family ${{ matrix.family }} --output-dir dist/native/${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: xdg-audit-package-${{ matrix.family }}-${{ github.sha }}
          path: dist/native/${{ matrix.family }}/*
          if-no-files-found: error
          retention-days: 30

  package-publication-check:
    name: Signed publication rehearsal (local remote)
    needs: [native-packages, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install the actual production signing tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends apt-utils rpm createrepo-c gnupg
      - uses: actions/download-artifact@v4
        with:
          pattern: xdg-audit-package-*-${{ github.sha }}
          path: native-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: xdg-audit-source-${{ github.sha }}
          path: native-artifacts/source
      - name: Test first publication, rerun, renewal and tamper refusal without production credentials
        run: python3 -B packaging/rehearse_publication.py --artifact-dir native-artifacts

  snapd-live:
    name: Real snapd inventory and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and start the real snapd service
        timeout-minutes: 12
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends snapd squashfs-tools
          sudo systemctl start snapd.socket
          sudo timeout 120s snap wait system seed.loaded
          snap version
      - name: Install only local metadata-only fixtures, including a disabled parallel instance
        timeout-minutes: 4
        run: |
          fixture="$RUNNER_TEMP/xdg-audit-local-snap"
          mkdir -p "$fixture/source/meta"
          cat > "$fixture/source/meta/snap.yaml" <<'YAML'
          name: xdg-audit-fixture
          version: '1.0'
          summary: Disposable xdg-audit inventory fixture
          description: Metadata only, with no applications, hooks or external runtime.
          base: none
          grade: devel
          confinement: strict
          YAML
          mksquashfs "$fixture/source" "$fixture/xdg-audit-fixture.snap" -noappend -all-root -comp xz -processors 1
          sudo snap set system experimental.parallel-instances=true
          sudo snap install --dangerous "$fixture/xdg-audit-fixture.snap"
          sudo snap install --dangerous --name=xdg-audit-fixture_blue "$fixture/xdg-audit-fixture.snap"
          sudo snap disable xdg-audit-fixture_blue
      - name: Installed instances protect disposable data as a regular user
        run: /usr/bin/python3 scripts/smoke_snapd.py --phase installed
      - name: Remove only the base fixture, retaining its disabled parallel instance
        run: sudo snap remove --purge xdg-audit-fixture
      - name: Real inventory and explicit MOVE, RESTORE and PURGE as a regular user
        run: /usr/bin/python3 scripts/smoke_snapd.py --phase removed
      - name: Clean up only the exact test fixtures
        if: always()
        run: |
          if command -v snap >/dev/null; then
            sudo timeout 60s snap remove --purge xdg-audit-fixture_blue xdg-audit-fixture || true
          fi

  benchmark:
    name: Synthetic scan benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only synthetic benchmark
        run: python scripts/benchmark_scan.py --count 750 | tee scan-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: scan-benchmark-${{ github.sha }}
          path: scan-benchmark.json
          retention-days: 30
