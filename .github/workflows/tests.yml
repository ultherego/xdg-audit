name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Unit and regression tests (stdlib only)
        run: python -m unittest discover -s tests -q
      - name: CLI smoke test
        run: python xdg_audit.py --version

  archives:
    name: Source ZIP and tar.gz
    needs: [test, gui-smoke, wayland-smoke, benchmark, quarantine-cycle, native-sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible archives
        run: python scripts/build_archives.py --output-dir dist
      - name: Verify archive integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          unzip -t *.zip | tail -n 1
          tar -tzf *.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: xdg-audit-source-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release on version tag
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [test, gui-smoke, wayland-smoke, benchmark, quarantine-cycle, native-sources, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches source version
        shell: bash
        run: |
          actual=$(python -c 'import xdg_audit; print(xdg_audit.VERSION)')
          if [[ "$GITHUB_REF_NAME" != "v$actual" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application v$actual" >&2
            exit 1
          fi
      - name: Build archives
        run: python scripts/build_archives.py --output-dir dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-dev* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --title "xdg-audit $GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}"

  gui-smoke:
    name: Native GUI smoke (Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install GTK4, Qt6, Tk, and Xvfb
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends xvfb xauth x11-utils python3-gi gir1.2-gtk-4.0 python3-pyqt6 python3-tk
      - name: GTK4 widget/model
        run: xvfb-run -a /usr/bin/python3 scripts/gui_smoke.py --backend gtk4
      - name: Qt6 widget/model
        run: xvfb-run -a /usr/bin/python3 scripts/gui_smoke.py --backend qt6
      - name: Tk widget/model
        run: xvfb-run -a /usr/bin/python3 scripts/gui_smoke.py --backend tk
      - name: GTK4 full application startup with Snap scope
        run: xvfb-run -a /usr/bin/python3 scripts/gui_app_smoke.py --backend gtk4 --scope snap
      - name: GTK4 PURGE preview remains responsive
        run: xvfb-run -a /usr/bin/python3 scripts/gui_async_purge_smoke.py
      - name: GTK4 shows disk-full error and refuses PURGE confirmation
        run: xvfb-run -a /usr/bin/python3 scripts/gui_async_purge_smoke.py --disk-full
      - name: Qt6 full application startup with Snap scope
        run: xvfb-run -a /usr/bin/python3 scripts/gui_app_smoke.py --backend qt6 --scope snap
      - name: Tk full application startup with Snap scope
        run: xvfb-run -a /usr/bin/python3 scripts/gui_app_smoke.py --backend tk --scope snap
      - name: Desktop registration and real launcher path escaping
        run: /usr/bin/python3 scripts/desktop_entry_smoke.py

  wayland-smoke:
    name: Native Wayland smoke (Weston)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install Weston and native GTK4/Qt6 Wayland clients
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends weston python3-gi gir1.2-gtk-4.0 python3-pyqt6 qt6-wayland
      - name: GTK4 full application on native Wayland
        run: /usr/bin/python3 scripts/gui_wayland_smoke.py --backend gtk4
      - name: Qt6 full application on native Wayland
        run: /usr/bin/python3 scripts/gui_wayland_smoke.py --backend qt6

  quarantine-cycle:
    name: Quarantine and restore E2E (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safe full cycle on disposable XDG data
        run: python scripts/smoke_quarantine_cycle.py --synthetic-inventory

  native-sources:
    name: Native ${{ matrix.provider }} inventory and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            provider: dpkg
          - image: fedora:43
            provider: rpm
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install native test prerequisites
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -qq
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends python3 git passwd util-linux ca-certificates
          else
            dnf -y --setopt=timeout=30 --setopt=retries=2 install python3 git shadow-utils util-linux
          fi
          useradd --create-home audit-test
      - uses: actions/checkout@v4
      - name: Native distribution regressions as an unprivileged user
        run: runuser -u audit-test -- env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -q
      - name: Real native inventory and complete quarantine lifecycle
        run: runuser -u audit-test -- env PYTHONDONTWRITEBYTECODE=1 python3 scripts/smoke_native_sources.py --expect ${{ matrix.provider }}

  benchmark:
    name: Synthetic scan benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only synthetic benchmark
        run: python scripts/benchmark_scan.py --count 750 | tee scan-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: scan-benchmark-${{ github.sha }}
          path: scan-benchmark.json
          retention-days: 30
