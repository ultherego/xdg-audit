name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Unit and regression tests (stdlib only)
        run: python -m unittest discover -s tests -q
      - name: CLI smoke test
        run: python xdg_audit.py --version

  archives:
    name: Source ZIP and tar.gz
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible archives
        run: python scripts/build_archives.py --output-dir dist
      - name: Verify archive integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          unzip -t *.zip | tail -n 1
          tar -tzf *.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: xdg-audit-source-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release on version tag
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [test, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches source version
        shell: bash
        run: |
          actual=$(python xdg_audit.py --version | awk '{print $NF}')
          if [[ "$GITHUB_REF_NAME" != "v$actual" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application v$actual" >&2
            exit 1
          fi
      - name: Build archives
        run: python scripts/build_archives.py --output-dir dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-dev* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --title "xdg-audit $GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}"
