name: Recover v1.7.0-rc1 prerelease (temporary)

# Runs once when merged to main. This tag's original run had all eight
# verification jobs green; the release step alone failed on a doubled "v".
# Use the immutable, already-pushed tag rather than rewriting it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc1-recovery.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish verified v1.7.0-rc1 prerelease
    if: github.repository == 'ultherego/xdg-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.7.0-rc1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the original RC commit and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '62e777200ee30bd0f3468d005a553ff628fb1248'
          actual=$(python -c 'import xdg_audit; print(xdg_audit.VERSION)')
          test "v$actual" = 'v1.7.0-rc1'
      - name: Verify all original tag quality checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          successes=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40239639705/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name != "GitHub release on version tag") | select(.conclusion == "success")] | length')
          test "$successes" = '8'
      - name: Rebuild and verify tagged source archives
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_archives.py --output-dir dist
          (cd dist && sha256sum -c SHA256SUMS && unzip -t *.zip | tail -n 1 && tar -tzf *.tar.gz >/dev/null)
      - name: Publish prerelease using the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.7.0-rc1 >/dev/null 2>&1; then
            echo 'Release already exists; nothing to publish.'
            exit 0
          fi
          gh release create v1.7.0-rc1 \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --prerelease \
            --title 'xdg-audit v1.7.0-rc1' \
            --notes-file RELEASE_NOTES.md
