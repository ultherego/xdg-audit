name: Signed package repository

on:
  workflow_call:
    inputs:
      publish_new:
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: signed-package-repository
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule' || vars.PACKAGES_SIGNING_FINGERPRINT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: package-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive over HTTPS
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$sources" ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
      - name: Install repository signing tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends apt-utils rpm createrepo-c gnupg
      - uses: actions/download-artifact@v4
        if: inputs.publish_new == true
        with:
          pattern: xdg-audit-package-*-${{ github.sha }}
          path: native-artifacts
      - uses: actions/download-artifact@v4
        if: inputs.publish_new == true
        with:
          name: xdg-audit-source-${{ github.sha }}
          path: native-artifacts/source
      - name: Authenticate, sign and atomically publish the packages branch
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
          PACKAGES_SIGNING_FINGERPRINT: ${{ vars.PACKAGES_SIGNING_FINGERPRINT }}
          PUBLISH_NEW: ${{ inputs.publish_new || false }}
        run: |
          python3 -B packaging/publish_repository.py \
            --work-dir "$RUNNER_TEMP/xdg-package-public" \
            --artifact-dir "$GITHUB_WORKSPACE/native-artifacts" \
            --release-dir "$GITHUB_WORKSPACE/signed-release"
      - uses: actions/upload-artifact@v4
        if: inputs.publish_new == true
        with:
          name: xdg-audit-signed-${{ github.sha }}
          path: signed-release/*
          if-no-files-found: error
          retention-days: 30
